<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Entrar - Controle de Entregas</title>
</head>
<body class="login-page">
  <div class="login-box">
    <h1>Controle de Entregas</h1>

    <div class="tabs">
      <button id="tab-login" class="tab ativo">Entrar</button>
      <button id="tab-cadastro" class="tab">Cadastrar</button>
    </div>

    <form id="form-login" class="form-ativo">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-senha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>

    <form id="form-cadastro" class="form-escondido">
      <input type="email" id="cad-email" placeholder="Email" required>
      <input type="password" id="cad-senha" placeholder="Senha (mín. 6 caracteres)" minlength="6" required>
      <input type="password" id="cad-senha2" placeholder="Confirme a senha" required>
      <button type="submit">Criar conta</button>
    </form>

    <p id="msg-erro"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
